# Dependabot-konfigurasjon for StudyWise.
# GitHub scanner repo-et og åpner PR-er for oppdateringer i npm + GitHub Actions.
#
# Sikkerhetsfilosofi:
#   * Security-PR-er åpnes umiddelbart via GitHub Advisory Database.
#   * Versjonsoppdateringer begrenses via "open-pull-requests-limit" for å unngå
#     å drukne CI i parallelle PR-er.
#   * Større oppdateringer (major) grupperes per økosystem for enklere review.
#   * pnpm-workspaces: én `npm`-konfig i rot er tilstrekkelig fordi Dependabot
#     oppdager workspace-pakkene via pnpm-workspace.yaml.

version: 2
updates:
  # npm (pnpm-workspaces)
  # Deaktivert: npm-oppdateringer håndteres av update-dependencies.yml som
  # kjører `pnpm -r update` + typecheck/lint/build i én samle-PR.
  # Dependabot her ville laget redundante PR-er med motstridende lockfile.
  # Security-advisories (npm) fanges fortsatt automatisk av GitHub uavhengig
  # av denne konfigurasjonen.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 0 # Deaktivert — kun security alerts åpner PR-er

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      actions-all:
        patterns:
          - "*"
