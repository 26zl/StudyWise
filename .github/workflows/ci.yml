name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Workflow-lint (rask, ingen avhengigheter)
  actionlint:
    name: Workflow lint (Actionlint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        shell: bash

      - name: Check workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash

  # 2. Kodekvalitet og build (hovedport for å merge)
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: [actionlint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build common
        run: pnpm --filter common build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Lint markdown
        run: pnpm lint:md

      - name: Verify build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:4000"

  # 3. Avhengighetsscanning (rask)
  dependency-scan:
    name: Dependency Scan (pnpm audit)
    runs-on: ubuntu-latest
    needs: [actionlint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  # 4. Scan etter leaks
  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    needs: [actionlint]

    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog - Scan for leaked secrets
        uses: trufflesecurity/trufflehog@v3.93.6
        with:
          extra_args: --only-verified

  # 5. Snyk (avhengigheter + sårbarheter, kjører når SNYK_TOKEN er satt)
  snyk-scan:
    name: Snyk (dependency & vulnerability scan)
    runs-on: ubuntu-latest
    needs: [actionlint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for Snyk token
        id: snyk_check
        run: |
          if [ -n "$SNYK_TOKEN" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk to check for vulnerabilities
        if: steps.snyk_check.outputs.run == 'true'
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects
