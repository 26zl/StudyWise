name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "filer_prosjekt/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "filer_prosjekt/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Workflow-lint – må være grønn før andre jobber kjører (needs: [actionlint] under)
  actionlint:
    name: Workflow lint (Actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run actionlint
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2.1.2

  # 2. Kodekvalitet og build (kjører kun når actionlint er grønn)
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [actionlint]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install safe-chain (pinned release)
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.4.7/install-safe-chain.sh | sh -s -- --ci

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --safe-chain-skip-minimum-package-age

      - name: Build common
        run: pnpm --filter common build

      - name: Unit tests
        run: pnpm test:unit

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Lint markdown
        run: pnpm lint:md

      - name: Verify dependency versions are in sync
        run: pnpm syncpack:list

      - name: Lint soft-delete filters on User queries
        run: pnpm lint:soft-delete

      - name: Verify build
        run: pnpm build
        env:
          CI: "true"
          NEXT_PUBLIC_API_URL: "http://localhost:4000"
          INTERNAL_API_URL: "http://localhost:4000"

  # 3. Avhengighetsscanning (rask)
  dependency-scan:
    name: Dependency Scan (pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [actionlint]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install safe-chain (pinned release)
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.4.7/install-safe-chain.sh | sh -s -- --ci

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --safe-chain-skip-minimum-package-age

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  # 4. Scan etter leaks
  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [actionlint]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2
        with:
          egress-policy: audit

      - name: Checkout code (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: TruffleHog - Scan for leaked secrets
        uses: trufflesecurity/trufflehog@47e7b7cd74f578e1e3145d48f669f22fd1330ca6 # v3.94.3
        with:
          extra_args: --only-verified

  # 5. SBOM-generering (Software Bill of Materials)
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [actionlint]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install safe-chain (pinned release)
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.4.7/install-safe-chain.sh | sh -s -- --ci

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --safe-chain-skip-minimum-package-age

      - name: Generate SBOM
        # npx (ikke pnpm dlx): cdxgen er et eksternt CLI-verktøy, ikke en prosjektavhengighet.
        # pnpm dlx arver onlyBuiltDependencies-policy og blokkerer @appthreat/sqlite3.
        run: >-
          npx --yes @cyclonedx/cdxgen@latest
          -r
          -t nodejs
          --no-babel
          --spec-version 1.5
          --project-name studywise
          --project-version "${GITHUB_SHA}"
          -o sbom.json
          .

      - name: Verify SBOM structure
        run: |
          node <<'EOF'
          const fs = require("node:fs");

          const bom = JSON.parse(fs.readFileSync("sbom.json", "utf8"));
          const components = Array.isArray(bom.components) ? bom.components : [];
          const dependencies = Array.isArray(bom.dependencies) ? bom.dependencies : [];
          const workspaceComponents = new Set(
            (bom.metadata?.component?.components ?? []).map((component) => component.name),
          );
          const expectedWorkspaces = ["backend", "common", "docs", "frontend"];
          const missingWorkspaces = expectedWorkspaces.filter(
            (name) => !workspaceComponents.has(name),
          );

          if (components.length === 0) {
            console.error("SBOM has no components.");
            process.exit(1);
          }

          if (dependencies.length === 0) {
            console.error("SBOM has no dependency graph.");
            process.exit(1);
          }

          if (missingWorkspaces.length > 0) {
            console.error(
              `SBOM is missing workspace packages: ${missingWorkspaces.join(", ")}`,
            );
            process.exit(1);
          }

          console.log(
            `SBOM OK: ${components.length} components and ${dependencies.length} dependency nodes.`,
          );
          EOF

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json
          retention-days: 90
