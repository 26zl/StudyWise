name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "filer_prosjekt/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "filer_prosjekt/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Workflow-lint – må være grønn før andre jobber kjører (needs: [actionlint] under)
  actionlint:
    name: Workflow lint (Actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run actionlint
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2.1.2

  # 2. Kodekvalitet og build (kjører kun når actionlint er grønn)
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [actionlint]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install safe-chain (pinned release)
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.4.7/install-safe-chain.sh | sh -s -- --ci

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --safe-chain-skip-minimum-package-age

      - name: Build common
        run: pnpm --filter common build

      - name: Unit tests
        run: pnpm test:unit

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Lint markdown
        run: pnpm lint:md

      - name: Verify dependency versions are in sync
        run: pnpm syncpack:list

      - name: Lint soft-delete filters on User queries
        run: pnpm lint:soft-delete

      - name: Verify build
        run: pnpm build
        env:
          CI: "true"
          NEXT_PUBLIC_API_URL: "http://localhost:4000"
          INTERNAL_API_URL: "http://localhost:4000"

  # 3. Avhengighetsscanning (rask)
  dependency-scan:
    name: Dependency Scan (pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [actionlint]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install safe-chain (pinned release)
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.4.7/install-safe-chain.sh | sh -s -- --ci

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --safe-chain-skip-minimum-package-age

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  # 4. Scan etter leaks
  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [actionlint]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2
        with:
          egress-policy: audit

      - name: Checkout code (full history)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: TruffleHog - Scan for leaked secrets
        uses: trufflesecurity/trufflehog@6c05c4a00b91aa542267d8e32a8254774799d68d # v3.93.8
        with:
          extra_args: --only-verified

  # 5. SBOM-generering (Software Bill of Materials)
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [actionlint]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install safe-chain (pinned release)
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.4.7/install-safe-chain.sh | sh -s -- --ci

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --safe-chain-skip-minimum-package-age

      - name: Generate SBOM
        run: >-
          pnpm dlx @cyclonedx/cdxgen@12.1.3
          -r
          -t nodejs
          --no-babel
          --spec-version 1.5
          --project-name studywise
          --project-version "${GITHUB_SHA}"
          -o sbom.json
          .

      - name: Verify SBOM structure
        run: |
          node <<'EOF'
          const fs = require("node:fs");

          const bom = JSON.parse(fs.readFileSync("sbom.json", "utf8"));
          const components = Array.isArray(bom.components) ? bom.components : [];
          const dependencies = Array.isArray(bom.dependencies) ? bom.dependencies : [];
          const workspaceComponents = new Set(
            (bom.metadata?.component?.components ?? []).map((component) => component.name),
          );
          const expectedWorkspaces = ["backend", "common", "docs", "frontend"];
          const missingWorkspaces = expectedWorkspaces.filter(
            (name) => !workspaceComponents.has(name),
          );

          if (components.length === 0) {
            console.error("SBOM has no components.");
            process.exit(1);
          }

          if (dependencies.length === 0) {
            console.error("SBOM has no dependency graph.");
            process.exit(1);
          }

          if (missingWorkspaces.length > 0) {
            console.error(
              `SBOM is missing workspace packages: ${missingWorkspaces.join(", ")}`,
            );
            process.exit(1);
          }

          console.log(
            `SBOM OK: ${components.length} components and ${dependencies.length} dependency nodes.`,
          );
          EOF

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90
