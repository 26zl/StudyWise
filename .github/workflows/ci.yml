name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "filer_prosjekt/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "filer_prosjekt/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Workflow-lint – må være grønn før andre jobber kjører (needs: [actionlint] under)
  actionlint:
    name: Workflow lint (Actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2.1.2

  # 2. Kodekvalitet og build (kjører kun når actionlint er grønn)
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [actionlint]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install safe-chain (pinned release)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            https://github.com/AikidoSec/safe-chain/releases/download/1.4.7/install-safe-chain.sh \
            -o /tmp/install-safe-chain.sh
          sh /tmp/install-safe-chain.sh --ci

      - name: Verify safe-chain is installed
        shell: bash
        run: safe-chain -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --safe-chain-skip-minimum-package-age

      - name: Build common
        run: pnpm --filter common build

      - name: Unit tests
        run: pnpm test:unit

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Lint markdown
        run: pnpm lint:md

      - name: Verify dependency versions are in sync
        run: pnpm syncpack:list

      - name: Lint soft-delete filters on User queries
        run: pnpm lint:soft-delete

      - name: Verify build
        run: pnpm build
        env:
          CI: "true"
          NEXT_PUBLIC_API_URL: "http://localhost:4000"
          INTERNAL_API_URL: "http://localhost:4000"

  # 3. Avhengighetsscanning (rask) — skanner pnpm-lock.yaml mot OSV-databasen
  dependency-scan:
    name: Dependency Scan (OSV-Scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [actionlint]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml

  # 4. Scan etter leaks
  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [actionlint]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2
        with:
          egress-policy: audit

      - name: Checkout code (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog - Scan for leaked secrets
        uses: trufflesecurity/trufflehog@17456f8c7d042d8c82c9a8ca9e937231f9f42e26 # v3.95.2
        with:
          extra_args: --only-verified
