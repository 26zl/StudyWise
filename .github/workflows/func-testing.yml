name: Functional Testing

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter tests exec playwright install --with-deps chromium

      - name: Build common
        run: pnpm --filter common build

      - name: Verify required secrets
        run: |
          missing=""
          [ -z "${{ secrets.MONGO_URI }}" ] && missing="$missing MONGO_URI"
          [ -z "${{ secrets.REDIS_URL }}" ] && missing="$missing REDIS_URL"
          [ -z "${{ secrets.CLERK_SECRET_KEY }}" ] && missing="$missing CLERK_SECRET_KEY"
          [ -z "${{ secrets.ENCRYPTION_KEY }}" ] && missing="$missing ENCRYPTION_KEY"
          [ -z "${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" ] && missing="$missing NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
          [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ] && missing="$missing ANTHROPIC_API_KEY"
          [ -z "${{ secrets.COHERE_API_KEY }}" ] && missing="$missing COHERE_API_KEY"
          [ -z "${{ secrets.PINECONE_API_KEY }}" ] && missing="$missing PINECONE_API_KEY"
          [ -z "${{ secrets.PINECONE_INDEX_NAME }}" ] && missing="$missing PINECONE_INDEX_NAME"
          [ -z "${{ secrets.AUTH_TURNSTILE_GATE_SECRET }}" ] && missing="$missing AUTH_TURNSTILE_GATE_SECRET"
          [ -z "${{ secrets.TURNSTILE_SECRET_KEY }}" ] && missing="$missing TURNSTILE_SECRET_KEY"
          [ -z "${{ secrets.AUTH_TURNSTILE_SECRET_KEY }}" ] && missing="$missing AUTH_TURNSTILE_SECRET_KEY"
          [ -z "${{ secrets.CONTACT_WORKER_URL }}" ] && missing="$missing CONTACT_WORKER_URL"
          [ -z "${{ secrets.CONTACT_WORKER_SECRET }}" ] && missing="$missing CONTACT_WORKER_SECRET"
          [ -z "${{ secrets.CONTACT_TO_EMAIL }}" ] && missing="$missing CONTACT_TO_EMAIL"
          [ -z "${{ secrets.CONTACT_FROM_EMAIL }}" ] && missing="$missing CONTACT_FROM_EMAIL"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
          echo "All required secrets are configured"

      - name: Create backend .env from secrets
        run: |
          cat > backend/.env <<ENVEOF
          PORT=4000
          NODE_ENV=test
          LOG_LEVEL=info
          MONGO_URI=${{ secrets.MONGO_URI }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          COHERE_API_KEY=${{ secrets.COHERE_API_KEY }}
          PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME=${{ secrets.PINECONE_INDEX_NAME }}
          AUTH_TURNSTILE_GATE_SECRET=${{ secrets.AUTH_TURNSTILE_GATE_SECRET }}
          TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}
          AUTH_TURNSTILE_SECRET_KEY=${{ secrets.AUTH_TURNSTILE_SECRET_KEY }}
          CONTACT_WORKER_URL=${{ secrets.CONTACT_WORKER_URL }}
          CONTACT_WORKER_SECRET=${{ secrets.CONTACT_WORKER_SECRET }}
          CONTACT_TO_EMAIL=${{ secrets.CONTACT_TO_EMAIL }}
          CONTACT_FROM_EMAIL=${{ secrets.CONTACT_FROM_EMAIL }}
          WEB_ORIGINS=http://localhost:3000
          ENABLE_DIAGNOSTICS=true
          ENVEOF
          sed -i 's/^[[:space:]]*//' backend/.env
          echo "Backend .env created with $(wc -l < backend/.env) lines"
          echo "Keys found: $(grep -c '=' backend/.env)"

      - name: Create frontend .env from secrets
        run: |
          cat > frontend/.env <<ENVEOF
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          ENVEOF
          sed -i 's/^[[:space:]]*//' frontend/.env
          echo "Frontend .env created with $(wc -l < frontend/.env) lines"

      - name: Run Playwright E2E tests
        run: pnpm --filter tests test:e2e -- --project=chromium
        env:
          CI: "true"
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          AUTH_TURNSTILE_GATE_SECRET: ${{ secrets.AUTH_TURNSTILE_GATE_SECRET }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: tests/report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results
          path: tests/results/
          retention-days: 30
