name: Functional Testing

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Start local test infrastructure
        run: |
          docker run -d --name studywise-redis -p 6379:6379 redis:7-alpine --save "" --appendonly no
          docker run -d --name studywise-mongo -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all

      - name: Initialize local MongoDB replica set
        run: |
          redis_ready=""
          for _ in {1..30}; do
            if docker exec studywise-redis redis-cli ping | grep -q PONG; then
              redis_ready="1"
              break
            fi
            sleep 2
          done

          if [ -z "$redis_ready" ]; then
            echo "::error::Redis ble ikke klar i tide"
            docker logs studywise-redis
            exit 1
          fi

          mongo_ready=""
          for _ in {1..30}; do
            if docker exec studywise-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1; then
              mongo_ready="1"
              break
            fi
            sleep 2
          done

          if [ -z "$mongo_ready" ]; then
            echo "::error::Mongo ble ikke klar for replika-sett-initiering"
            docker logs studywise-mongo
            exit 1
          fi

          docker exec studywise-mongo mongosh --quiet --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] })'

          for _ in {1..30}; do
            if docker exec studywise-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary ? 1 : 0' | grep -q 1; then
              exit 0
            fi
            sleep 2
          done

          echo "::error::Mongo replica set ble ikke klar i tide"
          docker logs studywise-mongo
          exit 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter tests exec playwright install --with-deps chromium

      - name: Build common
        run: pnpm --filter common build

      - name: Verify required secrets
        run: |
          missing=""
          [ -z "${{ secrets.CLERK_SECRET_KEY }}" ] && missing="$missing CLERK_SECRET_KEY"
          [ -z "${{ secrets.ENCRYPTION_KEY }}" ] && missing="$missing ENCRYPTION_KEY"
          [ -z "${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" ] && missing="$missing NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
          [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ] && missing="$missing ANTHROPIC_API_KEY"
          [ -z "${{ secrets.COHERE_API_KEY }}" ] && missing="$missing COHERE_API_KEY"
          [ -z "${{ secrets.PINECONE_API_KEY }}" ] && missing="$missing PINECONE_API_KEY"
          [ -z "${{ secrets.PINECONE_INDEX_NAME }}" ] && missing="$missing PINECONE_INDEX_NAME"
          [ -z "${{ secrets.AUTH_TURNSTILE_GATE_SECRET }}" ] && missing="$missing AUTH_TURNSTILE_GATE_SECRET"
          [ -z "${{ secrets.TURNSTILE_SECRET_KEY }}" ] && missing="$missing TURNSTILE_SECRET_KEY"
          [ -z "${{ secrets.AUTH_TURNSTILE_SECRET_KEY }}" ] && missing="$missing AUTH_TURNSTILE_SECRET_KEY"
          [ -z "${{ secrets.CONTACT_WORKER_URL }}" ] && missing="$missing CONTACT_WORKER_URL"
          [ -z "${{ secrets.CONTACT_WORKER_SECRET }}" ] && missing="$missing CONTACT_WORKER_SECRET"
          [ -z "${{ secrets.CONTACT_TO_EMAIL }}" ] && missing="$missing CONTACT_TO_EMAIL"
          [ -z "${{ secrets.CONTACT_FROM_EMAIL }}" ] && missing="$missing CONTACT_FROM_EMAIL"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
          echo "All required secrets are configured"

      - name: Create backend .env from secrets
        env:
          S_CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          S_ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          S_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          S_COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          S_PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          S_PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          S_AUTH_TURNSTILE_GATE_SECRET: ${{ secrets.AUTH_TURNSTILE_GATE_SECRET }}
          S_TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          S_AUTH_TURNSTILE_SECRET_KEY: ${{ secrets.AUTH_TURNSTILE_SECRET_KEY }}
          S_CONTACT_WORKER_URL: ${{ secrets.CONTACT_WORKER_URL }}
          S_CONTACT_WORKER_SECRET: ${{ secrets.CONTACT_WORKER_SECRET }}
          S_CONTACT_TO_EMAIL: ${{ secrets.CONTACT_TO_EMAIL }}
          S_CONTACT_FROM_EMAIL: ${{ secrets.CONTACT_FROM_EMAIL }}
        run: |
          {
            printf '%s\n' "PORT=4000"
            printf '%s\n' "NODE_ENV=test"
            printf '%s\n' "LOG_LEVEL=info"
            printf '%s\n' "WEB_ORIGINS=http://localhost:3000"
            printf '%s\n' "ENABLE_DIAGNOSTICS=true"
            printf '%s\n' "MONGO_URI=mongodb://127.0.0.1:27017/studywise?replicaSet=rs0&directConnection=true"
            printf '%s\n' "REDIS_URL=redis://127.0.0.1:6379"
            printf 'CLERK_SECRET_KEY=%s\n' "$S_CLERK_SECRET_KEY"
            printf 'ENCRYPTION_KEY=%s\n' "$S_ENCRYPTION_KEY"
            printf 'ANTHROPIC_API_KEY=%s\n' "$S_ANTHROPIC_API_KEY"
            printf 'COHERE_API_KEY=%s\n' "$S_COHERE_API_KEY"
            printf 'PINECONE_API_KEY=%s\n' "$S_PINECONE_API_KEY"
            printf 'PINECONE_INDEX_NAME=%s\n' "$S_PINECONE_INDEX_NAME"
            printf 'AUTH_TURNSTILE_GATE_SECRET=%s\n' "$S_AUTH_TURNSTILE_GATE_SECRET"
            printf 'TURNSTILE_SECRET_KEY=%s\n' "$S_TURNSTILE_SECRET_KEY"
            printf 'AUTH_TURNSTILE_SECRET_KEY=%s\n' "$S_AUTH_TURNSTILE_SECRET_KEY"
            printf 'CONTACT_WORKER_URL=%s\n' "$S_CONTACT_WORKER_URL"
            printf 'CONTACT_WORKER_SECRET=%s\n' "$S_CONTACT_WORKER_SECRET"
            printf 'CONTACT_TO_EMAIL=%s\n' "$S_CONTACT_TO_EMAIL"
            printf 'CONTACT_FROM_EMAIL=%s\n' "$S_CONTACT_FROM_EMAIL"
          } > backend/.env
          echo "Backend .env created with $(wc -l < backend/.env) lines"
          echo "Keys found: $(grep -c '=' backend/.env)"

      - name: Create frontend .env from secrets
        env:
          S_CLERK_PK: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          printf 'NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=%s\n' "$S_CLERK_PK" > frontend/.env
          echo "Frontend .env created with $(wc -l < frontend/.env) lines"

      - name: Run Playwright E2E tests
        run: pnpm --filter tests test:e2e -- --project=chromium
        env:
          CI: "true"
          PORT: "4000"
          NODE_ENV: "test"
          LOG_LEVEL: "info"
          WEB_ORIGINS: "http://localhost:3000"
          ENABLE_DIAGNOSTICS: "true"
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          MONGO_URI: "mongodb://127.0.0.1:27017/studywise?replicaSet=rs0&directConnection=true"
          REDIS_URL: "redis://127.0.0.1:6379"
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          AUTH_TURNSTILE_GATE_SECRET: ${{ secrets.AUTH_TURNSTILE_GATE_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          AUTH_TURNSTILE_SECRET_KEY: ${{ secrets.AUTH_TURNSTILE_SECRET_KEY }}
          CONTACT_WORKER_URL: ${{ secrets.CONTACT_WORKER_URL }}
          CONTACT_WORKER_SECRET: ${{ secrets.CONTACT_WORKER_SECRET }}
          CONTACT_TO_EMAIL: ${{ secrets.CONTACT_TO_EMAIL }}
          CONTACT_FROM_EMAIL: ${{ secrets.CONTACT_FROM_EMAIL }}

      - name: Show local infrastructure logs on failure
        if: failure()
        run: |
          docker logs studywise-mongo || true
          docker logs studywise-redis || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: tests/report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results
          path: tests/results/
          retention-days: 30
