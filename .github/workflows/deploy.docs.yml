name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - ".github/workflows/deploy.docs.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install safe-chain (pinned release)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            https://github.com/AikidoSec/safe-chain/releases/download/1.4.7/install-safe-chain.sh \
            -o /tmp/install-safe-chain.sh
          sh /tmp/install-safe-chain.sh --ci

      - name: Verify safe-chain is installed
        shell: bash
        run: safe-chain -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --safe-chain-skip-minimum-package-age

      - name: Build docs
        run: pnpm --filter docs build

      - name: Verify build output
        run: |
          set -euo pipefail
          BUILD_DIR="docs/docs/.vitepress/dist"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "Error: Build output directory not found: $BUILD_DIR"
            echo "Listing docs/docs/ for debugging:"
            ls -la docs/docs/ || echo "docs/docs/ does not exist"
            exit 1
          fi
          echo "Build output exists. Contents of $BUILD_DIR:"
          ls -la "$BUILD_DIR"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2
        with:
          egress-policy: audit

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
