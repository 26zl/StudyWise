# Deploy backend (Render) og frontend (Vercel) når CI er grønn på main.
# Vercel: bruker Deploy Hook (curl) — ingen Vercel CLI eller team-medlemskap nødvendig (koster penger).
# Render: bruker deploy hook. VERCEL_DEPLOY_HOOK og RENDER_DEPLOY_HOOK ligger i GitHub Secrets.

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

permissions:
  actions: read
  contents: read
  statuses: write
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (Vercel + Render)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      - name: Trigger Vercel deploy
        run: |
          echo "Triggering Vercel deployment via Deploy Hook…"
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}")
          echo "Vercel deploy hook response: $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Vercel deploy hook returned $status"
            exit 1
          fi
          echo "Vercel deploy hook triggered successfully"

      - name: Trigger Render deploy
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_DEPLOY_HOOK }}")
          echo "Render response: $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Render deploy hook returned $status"
            exit 1
          fi

      - name: Update GitHub deployment status
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            async function retry(fn, retries = 3, delay = 5000) {
              for (let i = 0; i < retries; i++) {
                try { return await fn(); }
                catch (e) {
                  if (e.status === 429 && i < retries - 1) {
                    await new Promise(r => setTimeout(r, delay * (i + 1)));
                  } else throw e;
                }
              }
            }
            const deployment = await retry(() => github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              environment: 'Production',
              auto_merge: false,
              required_contexts: [],
            }));
            await retry(() => github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: 'https://www.studwize.page',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            }));
