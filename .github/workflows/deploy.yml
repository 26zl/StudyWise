name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: read
  contents: read
  statuses: write
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy frontend to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Only deploy when all CI jobs pass (inkl. actionlint) and the trigger was a push (not a PR)
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2
        with:
          egress-policy: audit

      - name: Checkout verified commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build common
        run: pnpm --filter common build

      - name: Set git author for Vercel
        run: |
          git config user.email "${{ secrets.VERCEL_GIT_EMAIL }}"
          git config user.name "StudyWise CI"

      - name: Install Vercel CLI
        run: npm install -g vercel@50.37.0

      - name: Pull Vercel configuration
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify Datadog env cache
        run: |
          ENV_FILE=".vercel/.env.production.local"

          if [ ! -f "$ENV_FILE" ]; then
            echo "$ENV_FILE missing after vercel pull"
            ls -la .vercel || true
            exit 1
          fi

          read_env_value() {
            local key="$1"
            local line

            line=$(grep -m1 "^${key}=" "$ENV_FILE" || true)
            if [ -z "$line" ]; then
              return 1
            fi

            line="${line#*=}"
            line="${line%$'\r'}"

            if [ "${line#\"}" != "$line" ] && [ "${line%\"}" != "$line" ]; then
              line="${line#\"}"
              line="${line%\"}"
            fi

            printf '%s' "$line"
          }

          probe_key() {
            local key="$1"
            local line

            line=$(grep -m1 "^${key}=" "$ENV_FILE" || true)

            if [ -z "$line" ]; then
              echo "absent"
              return
            fi

            local value
            value=$(read_env_value "$key" || true)

            if [ -n "$value" ]; then
              echo "present (length=${#value})"
            else
              echo "empty"
            fi
          }

          require_any() {
            local label="$1"
            shift

            local key
            local value
            local status

            for key in "$@"; do
              value=$(read_env_value "$key" || true)
              if [ -n "$value" ]; then
                echo "${label}=present (${key}, length=${#value})"
                return
              fi

              status=$(probe_key "$key")
              echo "${key}=${status}"
            done

            echo "${label}=missing_or_empty"

            local available_keys
            available_keys=$(grep -E '^(NEXT_PUBLIC_DD_|DD_)' "$ENV_FILE" | cut -d= -f1 | paste -sd ',' - || true)
            if [ -n "$available_keys" ]; then
              echo "Datadog keys found in env file: ${available_keys}"
            else
              echo "No Datadog keys found in env file"
            fi

            exit 1
          }

          require_any DATADOG_APPLICATION_ID NEXT_PUBLIC_DD_RUM_APPLICATION_ID DD_RUM_APPLICATION_ID
          require_any DATADOG_CLIENT_TOKEN NEXT_PUBLIC_DD_RUM_CLIENT_TOKEN DD_RUM_CLIENT_TOKEN
          require_any DATADOG_SITE NEXT_PUBLIC_DD_SITE DD_SITE

      - name: Build with Vercel
        run: |
          ENV_FILE="$GITHUB_WORKSPACE/.vercel/.env.production.local"

          if [ ! -f "$ENV_FILE" ]; then
            echo "$ENV_FILE missing before vercel build"
            exit 1
          fi

          load_env_file() {
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                ''|\#*)
                  continue
                  ;;
              esac

              line="${line%$'\r'}"

              local key="${line%%=*}"
              local value="${line#*=}"

              if [ "${value#\"}" != "$value" ] && [ "${value%\"}" != "$value" ]; then
                value="${value#\"}"
                value="${value%\"}"
              fi

              export "$key=$value"
            done < "$ENV_FILE"
          }

          load_env_file

          if [ -z "${NEXT_PUBLIC_DD_RUM_APPLICATION_ID:-}" ] && [ -n "${DD_RUM_APPLICATION_ID:-}" ]; then
            export "NEXT_PUBLIC_DD_RUM_APPLICATION_ID=${DD_RUM_APPLICATION_ID}"
            echo "Mapped NEXT_PUBLIC_DD_RUM_APPLICATION_ID from DD_RUM_APPLICATION_ID"
          fi

          if [ -z "${NEXT_PUBLIC_DD_RUM_CLIENT_TOKEN:-}" ] && [ -n "${DD_RUM_CLIENT_TOKEN:-}" ]; then
            export "NEXT_PUBLIC_DD_RUM_CLIENT_TOKEN=${DD_RUM_CLIENT_TOKEN}"
            echo "Mapped NEXT_PUBLIC_DD_RUM_CLIENT_TOKEN from DD_RUM_CLIENT_TOKEN"
          fi

          if [ -z "${NEXT_PUBLIC_DD_SITE:-}" ] && [ -n "${DD_SITE:-}" ]; then
            export "NEXT_PUBLIC_DD_SITE=${DD_SITE}"
            echo "Mapped NEXT_PUBLIC_DD_SITE from DD_SITE"
          fi

          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Inspect Datadog markers in build output
        run: |
          ENV_FILE="$GITHUB_WORKSPACE/.vercel/.env.production.local"

          if [ ! -f "$ENV_FILE" ]; then
            echo "$ENV_FILE missing before Datadog inspection"
            exit 1
          fi

          read_env_value() {
            local key="$1"
            local line

            line=$(grep -m1 "^${key}=" "$ENV_FILE" || true)
            if [ -z "$line" ]; then
              return 1
            fi

            line="${line#*=}"
            line="${line%$'\r'}"

            if [ "${line#\"}" != "$line" ] && [ "${line%\"}" != "$line" ]; then
              line="${line#\"}"
              line="${line%\"}"
            fi

            printf '%s' "$line"
          }

          require_inlined_value() {
            local label="$1"
            shift

            local key
            local value

            for key in "$@"; do
              value=$(read_env_value "$key" || true)
              if [ -n "$value" ]; then
                break
              fi
              value=""
            done

            if [ -z "$value" ]; then
              echo "$label is missing or empty in .vercel/.env.production.local"
              exit 1
            fi

            for dir in frontend/.next .vercel/output; do
              if [ -d "$dir" ] && grep -R -F -q --binary-files=text --exclude='*.map' -- "$value" "$dir"; then
                echo "$label=inlined"
                return
              fi
            done

            echo "$label not inlined into build output"
            exit 1
          }

          search_markers() {
            local dir="$1"
            if command -v rg >/dev/null 2>&1; then
              rg -n --hidden --glob '!**/*.map' "studywise-frontend|Datadog RUM er deaktivert|us5\\.datadoghq\\.com|browser-intake" "$dir"
            else
              grep -R -n -E --exclude='*.map' "studywise-frontend|Datadog RUM er deaktivert|us5\\.datadoghq\\.com|browser-intake" "$dir"
            fi
          }

          require_inlined_value DD_RUM_APPLICATION_ID NEXT_PUBLIC_DD_RUM_APPLICATION_ID DD_RUM_APPLICATION_ID
          require_inlined_value DD_RUM_CLIENT_TOKEN NEXT_PUBLIC_DD_RUM_CLIENT_TOKEN DD_RUM_CLIENT_TOKEN

          found=0
          for dir in frontend/.next .vercel/output; do
            if [ -d "$dir" ]; then
              echo "Inspecting $dir"
              if search_markers "$dir"; then
                found=1
              fi
            fi
          done

          if [ "$found" -eq 0 ]; then
            echo "No Datadog markers found in build output"
            exit 1
          fi

      - name: Deploy frontend to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --force --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Backend deployes automatisk via Heroku Automatic Deploys fra main

      - name: Update GitHub deployment status
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;

            async function retry(fn, retries = 3, delay = 5000) {
              for (let i = 0; i < retries; i++) {
                try { return await fn(); }
                catch (e) {
                  if (e.status === 429 && i < retries - 1) {
                    await new Promise(r => setTimeout(r, delay * (i + 1)));
                  } else throw e;
                }
              }
            }

            const deployment = await retry(() => github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              environment: 'studywise-frontend',
              auto_merge: false,
              required_contexts: [],
            }));

            await retry(() => github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: 'https://www.studwize.page',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            }));
