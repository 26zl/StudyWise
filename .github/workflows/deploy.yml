name: Deploy

on:
  workflow_run:
    workflows: ["Functional Testing"]
    types: [completed]
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: read
  contents: read
  statuses: write
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-disabled:
    name: Vercel deploy disabled
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event.workflow_run.conclusion == 'success' && vars.VERCEL_DEPLOY_ENABLED != 'true'

    steps:
      - name: Explain skipped deploy
        run: |
          echo "Vercel frontend deploy is disabled."
          echo "Set repository variable VERCEL_DEPLOY_ENABLED=true and refresh VERCEL_* secrets to re-enable."

  deploy:
    name: Deploy frontend to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Deploy kun når både CI og Playwright E2E er grønne (Functional Testing trigges av CI).
    # Dette gir Heroku-parity: alle checks må være grønne før frontend deployes.
    # Vercel-prosjektet ble tatt ned etter prosjektslutt. Behold workflowen,
    # men kjør den bare når repo-variable VERCEL_DEPLOY_ENABLED er satt til true.
    if: github.event.workflow_run.conclusion == 'success' && vars.VERCEL_DEPLOY_ENABLED == 'true'

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout verified commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install safe-chain (pinned checksum)
        shell: bash
        run: bash scripts/install-safe-chain-ci.sh

      - name: Verify safe-chain is installed
        shell: bash
        run: safe-chain -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build common
        run: pnpm --filter common build

      - name: Verify Vercel CLI
        run: pnpm exec vercel --version

      - name: Pull Vercel configuration
        # Secret sendes via env i stedet for ${{ ... }} i run: for å unngå
        # shell-interpolation hvis tokenet inneholder metakarakter.
        run: pnpm exec vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build with Vercel
        run: |
          ENV_FILE="$GITHUB_WORKSPACE/.vercel/.env.production.local"

          if [ ! -f "$ENV_FILE" ]; then
            echo "$ENV_FILE missing before vercel build"
            exit 1
          fi

          load_env_file() {
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                ''|\#*)
                  continue
                  ;;
              esac

              line="${line%$'\r'}"

              local key="${line%%=*}"
              local value="${line#*=}"

              if [ "${value#\"}" != "$value" ] && [ "${value%\"}" != "$value" ]; then
                value="${value#\"}"
                value="${value%\"}"
              fi

              export "$key=$value"
            done < "$ENV_FILE"
          }

          load_env_file

          if [ -z "${NEXT_PUBLIC_DD_RUM_APPLICATION_ID:-}" ] && [ -n "${DD_RUM_APPLICATION_ID:-}" ]; then
            export "NEXT_PUBLIC_DD_RUM_APPLICATION_ID=${DD_RUM_APPLICATION_ID}"
          fi

          if [ -z "${NEXT_PUBLIC_DD_RUM_CLIENT_TOKEN:-}" ] && [ -n "${DD_RUM_CLIENT_TOKEN:-}" ]; then
            export "NEXT_PUBLIC_DD_RUM_CLIENT_TOKEN=${DD_RUM_CLIENT_TOKEN}"
          fi

          if [ -z "${NEXT_PUBLIC_DD_SITE:-}" ] && [ -n "${DD_SITE:-}" ]; then
            export "NEXT_PUBLIC_DD_SITE=${DD_SITE}"
          fi

          pnpm exec vercel build --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy frontend to Vercel
        id: deploy
        run: |
          out="$(pnpm exec vercel deploy --prebuilt --prod --force 2>&1)"
          echo "$out"
          url="$(printf '%s\n' "$out" | grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' | head -n 1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Backend deployes automatisk via Heroku Automatic Deploys fra main

      - name: Update GitHub deployment status
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;

            async function retry(fn, retries = 3, delay = 5000) {
              for (let i = 0; i < retries; i++) {
                try { return await fn(); }
                catch (e) {
                  if (e.status === 429 && i < retries - 1) {
                    await new Promise(r => setTimeout(r, delay * (i + 1)));
                  } else throw e;
                }
              }
            }

            const deployment = await retry(() => github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              environment: 'studywise-frontend',
              auto_merge: false,
              required_contexts: [],
            }));

            await retry(() => github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: 'https://www.studwize.page',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            }));
