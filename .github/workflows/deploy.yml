name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  actions: read
  contents: read
  statuses: write
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy frontend to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Only deploy when all CI jobs pass (inkl. actionlint) and the trigger was a push (not a PR)
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout verified commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build common
        run: pnpm --filter common build

      - name: Set git author for Vercel
        run: |
          git config user.email "${{ secrets.VERCEL_GIT_EMAIL }}"
          git config user.name "StudyWise CI"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel configuration
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Pull production environment variables
        run: vercel env pull frontend/.env.production.local --environment=production --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify frontend env presence
        run: |
          ENV_FILE="frontend/.env.production.local"

          require_key() {
            local key="$1"
            if grep -q "^${key}=" "$ENV_FILE"; then
              echo "${key}=present"
            else
              echo "${key}=missing"
              exit 1
            fi
          }

          require_any() {
            local found=0
            for key in "$@"; do
              if grep -q "^${key}=" "$ENV_FILE"; then
                echo "${key}=present"
                found=1
                break
              fi
            done

            if [ "$found" -eq 0 ]; then
              echo "missing any of: $*"
              exit 1
            fi
          }

          require_key CLERK_SECRET_KEY
          require_any NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY CLERK_PUBLISHABLE_KEY
          require_key NEXT_PUBLIC_CLERK_SIGN_IN_URL
          require_key NEXT_PUBLIC_CLERK_SIGN_UP_URL
          require_key NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL
          require_key NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL
          require_key INTERNAL_API_URL
          require_any NEXT_PUBLIC_DD_RUM_APPLICATION_ID DD_RUM_APPLICATION_ID
          require_any NEXT_PUBLIC_DD_RUM_CLIENT_TOKEN DD_RUM_CLIENT_TOKEN
          require_any NEXT_PUBLIC_DD_SITE DD_SITE

      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy frontend to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --force --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Backend deployes automatisk via Heroku Automatic Deploys fra main

      - name: Update GitHub deployment status
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;

            async function retry(fn, retries = 3, delay = 5000) {
              for (let i = 0; i < retries; i++) {
                try { return await fn(); }
                catch (e) {
                  if (e.status === 429 && i < retries - 1) {
                    await new Promise(r => setTimeout(r, delay * (i + 1)));
                  } else throw e;
                }
              }
            }

            const deployment = await retry(() => github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              environment: 'studywise-frontend',
              auto_merge: false,
              required_contexts: [],
            }));

            await retry(() => github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: 'https://www.studwize.page',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            }));
