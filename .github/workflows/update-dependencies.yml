# Automatisk oppdatering av dependencies – oppdaterer hele workspace og åpner PR ved endringer.
name: Update dependencies

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: update-deps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: pnpm update og PR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update dependencies (innenfor semver i package.json)
        run: pnpm -r update

      - name: Build common
        run: pnpm --filter common build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Verify build
        run: pnpm build
        env:
          CI: "true"
          NEXT_PUBLIC_API_URL: "http://localhost:4000"
          INTERNAL_API_URL: "http://localhost:4000"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: deps/auto-update
          delete-branch: true
          title: "chore(deps): automatisk oppdatering av avhengigheter"
          body: |
            Ukentlig oppdatering av dependencies med `pnpm -r update` (innenfor semver).
            Workflowen har allerede kjørt `pnpm typecheck`, `pnpm lint` og `pnpm build` før PR-en ble opprettet.
            (Ingen label slik at PR-en ikke auto-legges til kanban/project.)
          commit-message: "chore(deps): pnpm update"
