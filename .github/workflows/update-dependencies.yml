# Automatisk oppdatering av dependencies – oppdaterer hele workspace og åpner PR ved endringer.
name: Update dependencies

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: update-deps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: pnpm update og PR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update dependencies (innenfor semver i package.json)
        run: pnpm -r update

      - name: Build common
        run: pnpm --filter common build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Verify build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:4000"
          INTERNAL_API_URL: "http://localhost:4000"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: deps/auto-update
          delete-branch: true
          title: "chore(deps): automatisk oppdatering av avhengigheter"
          body: |
            Ukentlig oppdatering av dependencies med `pnpm -r update` (innenfor semver).
            Workflowen har allerede kjørt `pnpm typecheck`, `pnpm lint` og `pnpm build` før PR-en ble opprettet.
            (Ingen label slik at PR-en ikke auto-legges til kanban/project.)
          commit-message: "chore(deps): pnpm update"
