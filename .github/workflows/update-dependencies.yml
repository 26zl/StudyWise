# Automatisk oppdatering av dependencies – oppdaterer hele workspace og åpner PR ved endringer.
name: Update dependencies

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: update-deps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: pnpm update og PR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update dependencies (innenfor semver i package.json)
        run: pnpm update:safe

      - name: Build common
        run: pnpm --filter common build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Verify build
        run: pnpm build
        env:
          CI: "true"
          NEXT_PUBLIC_API_URL: "http://localhost:4000"
          INTERNAL_API_URL: "http://localhost:4000"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: deps/auto-update
          delete-branch: true
          title: "chore(deps): automatisk oppdatering av avhengigheter"
          body: |
            Ukentlig oppdatering av dependencies med `pnpm update:safe` (innenfor semver og minimumReleaseAge).
            Workflowen har allerede kjørt `pnpm typecheck`, `pnpm lint` og `pnpm build` før PR-en ble opprettet.
            (Ingen label slik at PR-en ikke auto-legges til kanban/project.)
          commit-message: "chore(deps): pnpm update"
