# OWASP Dependency-Check – kjører ukentlig (mandager 00:00 UTC)
name: OWASP Dependency-Check

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # 12.2.2/latest krasjet under NVD-import med "connectionPool is null" i GitHub Actions.
  # 12.2.1 er pinned til amd64-digest for reproducerbar ukentlig skann.
  DEPENDENCY_CHECK_IMAGE: owasp/dependency-check@sha256:e8e40735ec315869d46662c495588c41bc4a06bab8c069863cb9da4bb2b491a0

permissions:
  contents: read
  actions: read

jobs:
  owasp-dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install safe-chain (pinned checksum)
        shell: bash
        run: bash scripts/install-safe-chain-ci.sh

      - name: Verify safe-chain is installed
        shell: bash
        run: safe-chain -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Dependency-Check data cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.dependency-check
          key: dependency-check-data-v2-12.2.1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dependency-check-data-v2-12.2.1-${{ runner.os }}-

      # Vi kjører OWASP-containeren direkte i stedet for dependency-check/Dependency-Check_Action.
      # Den gamle actionen sender ekstra argumenter som én samlet streng og legger alltid på --noupdate,
      # noe som gjør ferske GitHub-runnere sårbare for argumentfeil eller manglende NVD-database.
      # Workspace-package.json ekskluderes fra Node Package Analyzer fordi pnpm har kun én
      # root-lockfile (pnpm-lock.yaml) som Pnpm Audit Analyzer scanner — dekker alle workspace-deps.
      # Uten exclude får vi "[WARN] No lock file exists" per workspace og false negatives.
      - name: OWASP Dependency-Check
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reports "$HOME/.dependency-check"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$HOME/.dependency-check:/usr/share/dependency-check/data" \
            "$DEPENDENCY_CHECK_IMAGE" \
            --data /usr/share/dependency-check/data \
            --project "StudyWise" \
            --scan /src \
            --format HTML \
            --out /src/reports \
            --nvdApiDelay 10000 \
            --nvdMaxRetryCount 20 \
            --connectiontimeout 30000 \
            --readtimeout 120000 \
            --enableRetired \
            --exclude "/src/**/node_modules/**" \
            --exclude "/src/**/.next/**" \
            --exclude "/src/backend/package.json" \
            --exclude "/src/frontend/package.json" \
            --exclude "/src/common/package.json" \
            --exclude "/src/docs/package.json" \
            --exclude "/src/tests/package.json"

      - name: Upload OWASP Dependency-Check report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owasp-dependency-check-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
