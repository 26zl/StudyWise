# OWASP Dependency-Check – kjører ukentlig (mandager 00:00 UTC)
name: OWASP Dependency-Check

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read

jobs:
  owasp-dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install safe-chain (pinned checksum)
        shell: bash
        run: bash scripts/install-safe-chain-ci.sh

      - name: Verify safe-chain is installed
        shell: bash
        run: safe-chain -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # dependency-check/Dependency-Check_Action: bruk @1.1.0 (v5 finnes ikke); input heter 'others' ikke 'args'
      # Workspace-package.json ekskluderes fra Node Package Analyzer fordi pnpm har kun én
      # root-lockfile (pnpm-lock.yaml) som Pnpm Audit Analyzer scanner — dekker alle workspace-deps.
      # Uten exclude får vi "[WARN] No lock file exists" per workspace og false negatives.
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@75ba02d6183445fe0761d26e836bde58b1560600 # 1.1.0
        with:
          project: "StudyWise"
          path: "."
          format: "HTML"
          others: |
            --enableRetired
            --exclude "**/node_modules/**"
            --exclude "**/.next/**"
            --exclude "backend/package.json"
            --exclude "frontend/package.json"
            --exclude "common/package.json"
            --exclude "docs/package.json"
            --exclude "tests/package.json"

      - name: Upload OWASP Dependency-Check report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owasp-dependency-check-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
