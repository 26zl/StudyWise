# StudyWise - Lokal kjøring med Docker
# Bruk: docker compose up --build
#
# Forutsetninger:
#   - backend/.env må finnes (kopier fra backend/.env.example, fyll inn alle påkrevde variabler)
#   - .env i prosjektrot med Clerk og INTERNAL_API_URL (kopier fra .env.docker.example)
#   - MongoDB og Redis startes av compose; backend/frontend bruker dem i nettverket

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "4000:4000"
    env_file:
      - backend/.env
    environment:
      - NODE_ENV=development
      - PORT=4000
      - MONGO_URI=mongodb://mongo:27017/studywise
      - REDIS_URL=redis://redis:6379
      - WEB_ORIGINS=http://localhost:3000
    depends_on:
      - mongo
      - redis

  frontend:
    build:
      context: .
      target: frontend
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:4000}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "3000:3000"
    environment:
      # development slik at auth-cookies (secure/sameSite) fungerer over http://localhost
      - NODE_ENV=development
      - INTERNAL_API_URL=${INTERNAL_API_URL:-http://backend:4000}
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - HOSTNAME=0.0.0.0
    depends_on:
      - backend

volumes:
  mongo-data:
