# StudyWise - Lokal kjøring med Docker
# Bruk: docker compose up --build
#
# Forutsetninger:
#   - backend/.env må finnes (kopier fra backend/.env.example, fyll inn alle påkrevde variabler)
#   - .env i prosjektrot må settes (kopier fra docker.env.example, fyll inn verdier)
#   - MongoDB og Redis startes av compose; backend/frontend bruker dem i nettverket
#
# Merk:
#   - Turnstile er av som standard i lokal Docker. Sett flagg og nøkler i .env for å teste det.
#   - Clerk-webhooks testes bare fullt lokalt hvis CLERK_WEBHOOK_SECRET er satt i backend/.env
#     og Clerk peker mot en lokal tunnel/webhook-URL.
#   - Docs/VitePress startes ikke av denne compose-filen. Kjør pnpm dev:docs separat ved behov.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MONGO_INITDB_ROOT_USERNAME: studywise
      MONGO_INITDB_ROOT_PASSWORD: studywise-dev
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--requirepass", "studywise-dev"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "studywise-dev", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "4000:4000"
    env_file:
      - backend/.env
    environment:
      - NODE_ENV=development
      - PORT=4000
      - MONGO_URI=mongodb://studywise:studywise-dev@mongo:27017/studywise?authSource=admin
      - REDIS_URL=redis://default:studywise-dev@redis:6379
      - WEB_ORIGINS=http://localhost:3000
      - TURNSTILE_ENABLED=${TURNSTILE_ENABLED:-false}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - AUTH_TURNSTILE_SECRET_KEY=${AUTH_TURNSTILE_SECRET_KEY:-}
      - AUTH_TURNSTILE_GATE_SECRET=${AUTH_TURNSTILE_GATE_SECRET:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      target: frontend
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_TURNSTILE_ENABLED: ${NEXT_PUBLIC_TURNSTILE_ENABLED:-false}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_AUTH_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_AUTH_TURNSTILE_SITE_KEY:-}
        # I Docker peker localhost på frontend-containeren selv.
        # Bruk Compose-servicenavnet slik at serverside-videresendinger treffer backend.
        INTERNAL_API_URL: ${DOCKER_INTERNAL_API_URL:-http://backend:4000}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/auth/sign-in}
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/auth/sign-up}
        NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL:-/dashboard}
        NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL:-/dashboard}
      secrets:
        - CLERK_SECRET_KEY
        - AUTH_TURNSTILE_GATE_SECRET
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "3000:3000"
    environment:
      # development slik at auth-cookies (secure/sameSite) fungerer over http://localhost
      - NODE_ENV=development
      # Hold Docker adskilt fra lokale miljøfiler utenfor Docker der INTERNAL_API_URL
      # kan være http://localhost:4000. I Docker må servicenavnet brukes.
      - INTERNAL_API_URL=${DOCKER_INTERNAL_API_URL:-http://backend:4000}
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - NEXT_PUBLIC_TURNSTILE_ENABLED=${NEXT_PUBLIC_TURNSTILE_ENABLED:-false}
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      - NEXT_PUBLIC_AUTH_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_AUTH_TURNSTILE_SITE_KEY:-}
      - AUTH_TURNSTILE_GATE_SECRET=${AUTH_TURNSTILE_GATE_SECRET:-}
      - NEXT_PUBLIC_CLERK_SIGN_IN_URL=${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/auth/sign-in}
      - NEXT_PUBLIC_CLERK_SIGN_UP_URL=${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/auth/sign-up}
      - NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL=${NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL:-/dashboard}
      - NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL=${NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL:-/dashboard}
      - HOSTNAME=0.0.0.0
    depends_on:
      - backend

secrets:
  CLERK_SECRET_KEY:
    environment: CLERK_SECRET_KEY
  AUTH_TURNSTILE_GATE_SECRET:
    environment: AUTH_TURNSTILE_GATE_SECRET

volumes:
  mongo-data:
  redis-data:
