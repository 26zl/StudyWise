services:
  backend:
    container_name: studywise-backend
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/backend/node_modules
      - /app/common/node_modules
      - /app/backend/dist
      - /app/common/dist
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - WEB_ORIGIN=http://localhost:3000
      - NODE_ENV=development
      - CI=true
    env_file:
      - ./backend/.env
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install --config.package-import-method=copy --store-dir /root/.pnpm-store && pnpm --filter common build && pnpm --filter backend dev"
    networks:
      - dev-network

  frontend:
    container_name: studywise-frontend
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/backend/node_modules
      - /app/common/node_modules
      - /app/frontend/.next
      - /app/frontend/dist
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - INTERNAL_API_URL=http://backend:4000
      - CI=true
    depends_on:
      - backend
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install --config.package-import-method=copy --store-dir /root/.pnpm-store && pnpm --filter common build && pnpm --filter frontend dev"
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge
