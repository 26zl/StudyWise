services:
  backend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/backend/node_modules
      - /app/common/node_modules
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - WEB_ORIGIN=http://localhost:3000
      - NODE_ENV=development
      - CI=true
    env_file:
      - ./backend/.env
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install && pnpm --filter backend dev"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/backend/node_modules
      - /app/common/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - INTERNAL_API_URL=http://backend:4000
      - CI=true
    depends_on:
      - backend
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install && pnpm --filter frontend dev"
